const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CITIES=["北京","上海","深圳","远程","其他"];let city=new Set();
const cityKey=c=>{const o=[];if(/北京/.test(c))o.push("北京");if(/上海/.test(c))o.push("上海");if(/深圳/.test(c))o.push("深圳");if(/远程/.test(c))o.push("远程");if(!o.length)o.push("其他");return o};
const cmMin=c=>{const m=(c||"").match(/\d+/);return m?+m[0]:1e9};

function card(j){const hot=!j.archived&&j.days_left!=null&&j.days_left<=7;const sc=j.score==null?'<div class="score s0">未评</div>':`<div class="score ${j.score>=70?"s1":j.score>=55?"s2":""}">${j.score}</div>`;
const t=j.url?`<a href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">${esc(j.title)}</a>`:esc(j.title);
const dl=j.deadline?`<span class="tag ${hot?"dl":""}">截止 ${j.deadline}${hot?` · 剩${j.days_left}天`:""}</span>`:'<span class="tag">截止 未写</span>';
return `<div class="job ${hot?"hot":""} ${j.archived?"arch":""}"><div class="top">${sc}<div><div class="t">${t}</div><div class="co">${esc(j.company)} · ${esc(j.city)}</div></div></div>

${j.note?`<div class="note">${esc(j.note)}</div>`:""}</div>`}
function sorted(a){const k=$("#sort").value;return a.slice().sort((x,y)=>{if(x.archived!==y.archived)return x.archived?1:-1;
if(k==="deadline")return (x.deadline||"9999")<(y.deadline||"9999")?-1:(x.deadline||"9999")>(y.deadline||"9999")?1:(y.score??-1)-(x.score??-1);
if(k==="commute")return cmMin(x.commute)-cmMin(y.commute)||(y.score??-1)-(x.score??-1);
if(k==="new")return (y.first_seen||"").localeCompare(x.first_seen||"")||(y.score??-1)-(x.score??-1);
return (y.score??-1)-(x.score??-1)||(x.deadline||"9999").localeCompare(y.deadline||"9999")})}
function render(){const q=$("#q").value.trim().toLowerCase(),g=$("#grp").value,sa=$("#arch").checked;
const f=D.jobs.filter(j=>(sa||!j.archived)&&(!g||j.group===g)&&(!city.size||cityKey(j.city).some(c=>city.has(c)))&&(!q||(j.title+j.company).toLowerCase().includes(q)));
const nw=sorted(f.filter(j=>j.new));$("#newsec").innerHTML=`<h2>今日新增 <span class="n">${D.meta.latest||""} · ${nw.length} 条</span></h2>`+(nw.length?`<div class="list">${nw.slice(0,12).map(card).join("")}</div>${nw.length>12?`<div class="empty">另有 ${nw.length-12} 条见下方分组</div>`:""}`:'<div class="empty">暂无</div>');
